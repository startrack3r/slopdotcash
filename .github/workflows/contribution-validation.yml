name: Contribution validation

on:
  push:
    branches: [codex/verify-contributions]

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            source: d80086e40911c8556bfe6418350fed5d2d974cf1
          - label: pr-2337
            source: fbd643d92e957aa1fca2115c17f07998434e7284
          - label: pr-2338
            source: ca32d32d0794db8598770898d3c6b62386d6b223
    env:
      CI: "true"
      VITE_SLOP_ENVIRONMENT: staging
      SLOP_API_ORIGIN: https://slop.cash
      SLOP_PROFILES_INPUT: data/profiles/seed.json
      SLOP_POINTS_ONLINE: "0"
      SLOP_E2E_WORKERS: "2"
      SOURCE_SHA: ${{ matrix.source }}
    steps:
      - name: Check out exact contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: startrack3r/slopdotcash
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p validation-logs
          git rev-parse HEAD HEAD^{tree} > validation-logs/source.txt
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
      - name: Prepare public registry and ledger
        id: prepare
        run: |
          set -euo pipefail
          bun run projects:sync
          bun scripts/download-leaderboard.ts https://slop.cash/data/leaderboard.json "$RUNNER_TEMP/slop-ledger.json"
          bun scripts/prepare-pr-ledger.ts "$RUNNER_TEMP/slop-ledger.json" public/data/leaderboard.json
          sha256sum src/lib/project-registry.generated.mjs src/lib/project-revisions.generated.json public/data/leaderboard.json > validation-logs/public-inputs.sha256
      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run format:check 2>&1 | tee validation-logs/format.log
      - name: Run full verification
        id: verify
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run verify 2>&1 | tee validation-logs/verify.log
      - name: Complete integration checks if verification stopped early
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.verify.outcome == 'failure' }}
        run: |
          set -o pipefail
          bun run test:integration 2>&1 | tee validation-logs/integration-followup.log
      - name: Build if verification stopped early
        id: build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.verify.outcome == 'failure' }}
        run: |
          set -o pipefail
          bun run build 2>&1 | tee validation-logs/build-followup.log
      - name: Install browser system dependencies
        id: browser_deps
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build.outcome == 'success') }}
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          sudo timeout --signal=TERM --kill-after=15s 20m "$(command -v node)" ./node_modules/playwright/cli.js install-deps chromium firefox
      - name: Install browsers and repository-pinned Chromium
        id: browsers
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: |
          timeout --signal=TERM --kill-after=15s 10m ./node_modules/.bin/playwright install chromium firefox
          bash scripts/install-ci-chromium.sh "$RUNNER_TEMP/slop-ci-chromium"
          echo "SLOP_E2E_CHROMIUM_EXECUTABLE_PATH=$RUNNER_TEMP/slop-ci-chromium/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Run complete browser suite
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee validation-logs/e2e.log
      - name: Record final source state
        if: always()
        run: |
          git rev-parse HEAD HEAD^{tree} > validation-logs/final-source.txt
          git status --short > validation-logs/worktree.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.label }}-${{ matrix.source }}
          path: |
            validation-logs
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 14
